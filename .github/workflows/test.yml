name: test

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless, so cancel it and free the runner slot. Runs on main always finish,
# each one is a record of what shipped.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  worker:
    name: Worker tests
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # The Worker has no dependencies, so there is nothing to install.
      - run: npm --prefix worker test

  client:
    name: Client tests (Python ${{ matrix.python-version }})
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor the client supports (macOS system Python), 3.13 is the newest we test against.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python client/tests/run_all.py
