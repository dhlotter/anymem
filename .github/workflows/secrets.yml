name: secrets

on:
  # Push only. Every branch push is scanned over its full range, so nothing lands
  # on main unseen. The pull_request trigger is gone: the action read PR commits the
  # workflow token cannot (403), and gitleaks-action v2 passes gitleaks 8.24 the
  # retired --config-path flag the moment a repo .gitleaks.toml exists, which fails
  # the job in two seconds without scanning. A pinned binary call has neither problem.
  push:

# A newer push to the same branch makes the older run pointless, so cancel it and free the runner slot. Runs on main always finish,
# each one is a record of what shipped. The next push is scanned over its full range, so a cancelled scan loses nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      # Full history, so the scan covers every commit in the branch.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          # The self-hosted runner image already has gitleaks and cannot write /usr/local/bin.
          if ! command -v gitleaks >/dev/null; then
            # 8.30.1 is the version the runner image pins and the one .gitleaks.toml was tested with.
            curl -sSfL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
            # The digest is the one GitHub publishes for this release asset. A changed download stops the job here.
            echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
            tar -xf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          fi
          gitleaks version
      - name: Secret scan
        run: gitleaks detect --config .gitleaks.toml --no-banner
