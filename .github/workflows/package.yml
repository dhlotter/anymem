name: package

on:
  # Pushes to main and pull requests only. A branch with a pull request used to run this twice per push, once for each event.
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless, so cancel it and free the runner slot. Runs on main always finish,
# each one is a record of what shipped.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  package:
    name: Package checks
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # Nothing to install. The checker uses only Node's own modules.
      - name: Checker self-test
        run: node scripts/check-shipped-files.mjs --self-test
      - name: Shipped files contain no private names or secrets
        run: node scripts/check-shipped-files.mjs
      # Advisory for now. The Claude Code CLI installs from npm, but whether strict validation
      # passes on a fresh runner is not proven yet, so a failure here is shown without failing the job.
      # Remove continue-on-error once the plugin validates cleanly on this runner.
      - name: Claude plugin validate (advisory)
        continue-on-error: true
        run: npx --yes @anthropic-ai/claude-code@2.1.302 plugin validate . --strict
